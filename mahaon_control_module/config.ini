; ============================================================
;       ПОЛНАЯ КОНФИГУРАЦИЯ ДЛЯ mrpt::graphslam
; ============================================================

; ------------------------------------------------------------
; 1. ОБЩАЯ КОНФИГУРАЦИЯ (используется всеми компонентами)
; ------------------------------------------------------------
[GeneralConfiguration]
; Минимальная разница ID узлов для поиска петли (используется CLoopCloserERD) [citation:4][citation:6][citation:10]
LC_min_nodeid_diff = 30

; ------------------------------------------------------------
; 2. ПАРАМЕТРЫ РЕГИСТРАЦИИ УЗЛОВ (NRD - CICPCriteriaNRD)
; ------------------------------------------------------------
[NodeRegistrationDeciderParameters]
; Максимальное расстояние (в метрах) для регистрации нового узла [citation:5][citation:9]
registration_max_distance = 0.5
; Максимальный угол (в радианах) для регистрации нового узла [citation:5][citation:9]
registration_max_angle = 0.15

; ------------------------------------------------------------
; 3. ПАРАМЕТРЫ РЕГИСТРАЦИИ РЕБЕР (ERD - CICPCriteriaERD + Loop Closer)
; ------------------------------------------------------------
[EdgeRegistrationDeciderParameters]
; Уровень детализации вывода (1=INFO) [citation:10]
class_verbosity = 1

; --- Параметры ICP для выравнивания сканов ---
; Максимальное расстояние для поиска соответствий при сканировании [citation:6][citation:10]
ICP_max_distance = 10.0
; Порог качества для принятия ребра от ICP (0..1) [citation:10]
ICP_goodness_thresh = 0.75

; --- Параметры обнаружения петель (CLoopCloserERD) ---
; Минимальная разница ID узлов для поиска петли [citation:4]
LC_min_nodeid_diff = 30
; Порог отношения собственных значений для подтверждения гипотезы о петле [citation:4]
LC_eigenvalues_ratio_thresh = 2.0
; Проверять только последнюю партицию узлов [citation:4][citation:8]
LC_check_curr_partition_only = true
; Минимальное количество удаленных узлов для поиска петли [citation:4][citation:8]
LC_min_remote_nodes = 5
; Полная партиция карты через каждые N новых узлов [citation:4][citation:8]
full_partition_per_nodes = 10

; --- Параметры визуализации (опционально, но можно отключить) ---
visualize_laser_scans = false
scans_img_external_dir = .

; ------------------------------------------------------------
; 4. ПАРАМЕТРЫ ОПТИМИЗАЦИИ (CLevMarqGSO)
; ------------------------------------------------------------
[OptimizerParameters]
; Уровень детализации вывода [citation:11]
class_verbosity = 1
; Минимальное количество узлов перед запуском оптимизации [citation:7]
min_nodes_for_optimization = 50
; Максимальное число последовательных петель, которые можно игнорировать [citation:7]
max_ignored_consec_lcs = 5
; Максимальное число последовательных петель, которые могут быть обработаны подряд [citation:7]
max_used_consec_lcs = 3
; Оптимизировать только узлы в пределах указанного расстояния [citation:7][citation:11]
optimization_distance = 10.0
; Использовать отдельный поток для оптимизации [citation:11]
optimization_on_second_thread = false

; --- Параметры Levenberg-Marquardt ---
; Максимальное число итераций [citation:11]
max_iterations = 100
; Масштаб гессиана [citation:11]
scale_hessian = 0.2
; Начальный параметр доверия (tau) [citation:11]
tau = 0.001