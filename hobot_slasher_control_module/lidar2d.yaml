# =====================================================================================
# Конвейер: точечно-точечный 2D ICP ГРАФ-SLAM
#
# См. https://github.com/MOLAorg/mola_mapper_2d
#
# Этот файл содержит параметры для mola::Mapper2D,
# для использования либо программно через initialize(), либо из системы MOLA
# launch файла. См. "mola-cli-launchs/*" примеры или основную документацию проекта.
# =====================================================================================

params:
  # Эти метки сенсоров будут обрабатываться как LIDAR наблюдения:
  # Могут быть переопределены через cli флаг --lidar-sensor-label

  # -----------------------------------------------
  # ВХОДНЫЕ ДАННЫЕ СЕНСОРОВ
  # -----------------------------------------------
  sensor_labels_for_simplemap: ["${MOLA_LIDAR_NAME|lidar}", ".*[Ll]aser.*"]

  lidar_sensor_labels: ["${MOLA_LIDAR_NAME|lidar}", ".*[Ll]aser.*"]

  odometry_sensor_label: "odom.*"

  # Эти метки сенсоров будут обрабатываться как GNSS (GPS) (Для хранения в simplemap только)
  gnss_sensor_label: "gps"

  multiple_lidars:
    lidar_count: ${MOLA_LIDAR_COUNT|1} # полезно только если используется несколько lidar_sensor_labels или регулярных выражений.
    max_time_offset: ${MOLA_LIDAR_MAX_TIME_OFFSET|25e-3} # [с]

  # Эти метки сенсоров будут обрабатываться как IMU наблюдения:
  imu_sensor_label: "imu"

  # Опционально, пропускать данные лидара слишком близкие по времени:
  min_time_between_scans: 1e-3 # [секунды]

  # -----------------------------------------------
  # ПУБЛИКАЦИЯ
  # -----------------------------------------------

  # При публикации обновлений позы, система координат для обеих: оцененных поз робота и локальной карты.
  publish_reference_frame: "${MOLA_LO_PUBLISH_REF_FRAME|map}"

  # При публикации обновлений позы, имя системы координат транспортного средства.
  publish_vehicle_frame: "${MOLA_LO_PUBLISH_VEHICLE_FRAME|base_link}"

  # -----------------------------------------------
  # ОСНОВНЫЕ ПАРАМЕТРЫ ГРАФ-SLAM
  # -----------------------------------------------

  max_dist_to_search_for_icp_edges: 6.0

  # Минимальное качество ICP для одометрии:
  min_icp_quality_odometry: 0.30

  # Минимальное качество ICP для принятия замыкания цикла (LC):
  min_icp_quality_loop_closure: 0.60

  # Минимальное качество ICP для замены старых ключевых кадров (обновления карты):
  min_icp_quality_keyframe_replacement: 0.60 # [0,1]
  min_keyframe_age_for_replacement: 10 # [секунды]

  # Сколько ребер между потенциальным KF-KF ребром, чтобы считать его замыканием цикла:
  min_topological_distance_for_loop_closure: 20

  # Одометрия колес используется для обновления последней локализации до тех пор, пока не выполнится
  # одно из следующих условий и не будет запущена новая релокализация:
  max_rotation_between_localizations: 10.0 # [градусы]
  max_translation_between_localizations: 0.5 # [м]
  max_time_between_localizations: 1.0 # [с]

  # Сколько ребер пытаться создать/обновить от текущей позы
  # до ближайших ключевых кадров:
  max_localization_edges: 7

  # После запуска релокализации, как далеко должна находиться поза робота относительно ближайшего
  # существующего ключевого кадра для создания нового KF:
  max_rotation_between_keyframes: 10.0 # [градусы]
  max_translation_between_keyframes: 0.5 # [м]

  max_time_for_odometry_edge: 60 # [с]

  max_lost_with_odometry_for_insertion: 1.5 # [м]

  odometry_edge_sigma: 0.2 # Минимальная неопределенность (1 сигма) ребер одометрии
  icp_edge_sigma: 0.1 # Неопределенность ребер ICP
  icp_edge_robust_param: 4.0 # Параметр робастного ядра Хубера (в "сигмах")

  # Если включено, карта будет храниться в ОЗУ и (при использовании CLI) сохранена
  # в файл ".simplemap" для последующего использования для локализации и т.д.
  simplemap:
    generate: ${MOLA_GENERATE_SIMPLEMAP|false} # Может быть переопределено через CLI флаг --output-simplemap
    load_existing_simple_map: ${MOLA_LOAD_SM|""}
    min_translation_between_keyframes: ${MOLA_SIMPLEMAP_MIN_XYZ|0.05} # м
    min_rotation_between_keyframes: ${MOLA_SIMPLEMAP_MIN_ROT|3.0} # град
    save_final_map_to_file: ${MOLA_SIMPLEMAP_OUTPUT|'final_map.simplemap'}
    save_gnss_max_age: 1.0 # [с] максимальный возраст наблюдений GNSS для хранения в ключевом кадре

  # Сохранять финальную траекторию в формате TUM. Отключено по умолчанию.
  estimated_trajectory:
    save_to_file: ${MOLA_SAVE_TRAJECTORY|false}
    output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.txt'}

  # Если запущено внутри контейнера mola-cli и присутствует mola_viz, используйте эти опции
  # для отображения прогресса в реальном времени:
  visualization:
    show_trajectory: true
    show_local_map: true
    show_current_observation: true # показывает "сырые" точки LiDAR в реальном времени
    current_pose_corner_size: 1.0
    local_map_point_size: 3.0
    map_update_decimation: 10
    camera_follows_vehicle: true
    camera_rotates_with_vehicle: false
    background_color_gray_level: 0.1
    model:
      - file: ${MOLA_VEHICLE_MODEL_FILE|""} # По умолчанию: нет
        tf.roll: 90.0 # град

  # Профилирование основных шагов конвейера одометрии:
  pipeline_profiler_enabled: ${MOLA_PROFILER|true}
  # Профилирование внутренних шагов реализации ICP:
  icp_profiler_enabled: ${MOLA_PROFILER|true}

  # Если установлено в false, конвейер одометрии будет игнорировать входящие наблюдения
  # пока active не будет установлен в true (например, через GUI).
  start_active: "${MOLA_START_ACTIVE|true}"

  # ----------------------
  # ОТЛАДКА
  # ----------------------
  save_3D_scenes_decimation: 50 # 0: отключено
  save_3D_scenes_prefix: /tmp/debug_graph_slam

# -----------------------------------
# Конфигурация конвейера ICP
# -----------------------------------
icp-lidar-odometry:
  class_name: mp2p_icp::ICP

  # См.: mp2p_icp::Parameter
  params:
    maxIterations: 200
    minAbsStep_trans: 1e-4
    minAbsStep_rot: 1e-4
    #generateDebugFiles: true

  solvers:
    - class: mp2p_icp::Solver_GaussNewton
      enabled: true
      params:
        maxIterations: 3
    - class: mp2p_icp::Solver_Horn
      enabled: true
      params: ~

  # Последовательность одной или нескольких пар (class, params), определяющих экземпляры mp2p_icp::Matcher
  # для сопоставления геометрических объектов между облаками точек.
  matchers:
    - class: mp2p_icp::Matcher_Point2Line
      params:
        # Порог расстояния для внутренних точек [метры][обязательно]
        distanceThreshold: 0.40
        # Количество соседей для поиска [обязательно]
        knn: 6
        # Минимальное количество найденных точек [обязательно]
        minimumLinePoints: 6
        # максимальное отношение e0/e2 и e1/e2 [обязательно]
        lineEigenThreshold: 1e-3
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 0.20
        runFromIteration: 3 # "от 0 до 0" означает "все"
        runUpToIteration: 0
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 0.75
        runFromIteration: 0 # "от 0 до 0" означает "все"
        runUpToIteration: 2
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }

  quality:
    - class: mp2p_icp::QualityEvaluator_PairedRatio
      params:
      threshold: 0.40
      pointLayerMatches:
        - { global: "2d_lidar_decim", local: "2d_lidar_decim" }

  # Фильтры для облаков точек
  #
  # Один объект фильтра будет создан для каждой записи, с созданием экземпляра указанного класса,
  # и с указанными параметрами. Фильтры выполняются в порядке определения на
  # входном объекте pointcloud_t.
  #
  filters:
    - class_name: mp2p_icp_filters::FilterDecimateVoxels
      params:
        input_pointcloud_layer: "2d_lidar"
        output_pointcloud_layer: "2d_lidar_decim"
        error_on_missing_input_layer: false # не завершать работу при отсутствии 2D лидара
        voxel_filter_resolution: 0.05 # [м]
        use_voxel_average: true
        bounding_box_min: [-25, -25, 0.1]
        bounding_box_max: [25, 25, 0.2]

  # Генераторы
  #
  generators:
    - class_name: mp2p_icp_filters::Generator
      params:
        target_pointcloud_layer: "2d_lidar"
        process_class_names_regex: ".*"
        process_sensor_labels_regex: "HOKUYO.*"

# -----------------------------------
# Конфигурация конвейера ICP
# -----------------------------------
icp-lidar-loop-closure:
  class_name: mp2p_icp::ICP

  # См.: mp2p_icp::Parameter
  params:
    maxIterations: 200
    minAbsStep_trans: 1e-4
    minAbsStep_rot: 1e-4
    #generateDebugFiles: true

  solvers:
    - class: mp2p_icp::Solver_GaussNewton
      enabled: true
      params:
        maxIterations: 3
    - class: mp2p_icp::Solver_Horn
      enabled: true
      params: ~

  # Последовательность одной или нескольких пар (class, params), определяющих экземпляры mp2p_icp::Matcher
  # для сопоставления геометрических объектов между облаками точек.
  matchers:
    - class: mp2p_icp::Matcher_Point2Line
      params:
        # Порог расстояния для внутренних точек [метры][обязательно]
        distanceThreshold: 0.50
        # Количество соседей для поиска [обязательно]
        knn: 6
        # Минимальное количество найденных точек [обязательно]
        minimumLinePoints: 6
        # максимальное отношение e0/e2 и e1/e2 [обязательно]
        lineEigenThreshold: 1e-3
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 0.20
        runFromIteration: 10 # "от 0 до 0" означает "все"
        runUpToIteration: 0
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }
    - class: mp2p_icp::Matcher_Points_DistanceThreshold
      params:
        threshold: 2.00
        runFromIteration: 0 # "от 0 до 0" означает "все"
        runUpToIteration: 10
        pointLayerMatches:
          - { global: "2d_lidar_decim", local: "2d_lidar_decim", weight: 1.0 }

  quality:
    - class: mp2p_icp::QualityEvaluator_PairedRatio
      params:
      threshold: 0.30
      pointLayerMatches:
        - { global: "2d_lidar_decim", local: "2d_lidar_decim" }